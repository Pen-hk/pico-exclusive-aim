name: Build Pico Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install toolchain
      uses: pico-sdk/setup-sdk@v1
      with:
        pico_sdk_version: 1.5.1
        
    - name: Checkout Pico SDK submodule
      run: |
        if [ ! -d "pico-sdk" ]; then
          git clone -b 1.5.1 https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk
          git submodule update --init
          cd ..
        fi
        
    - name: Build
      run: |
        cmake -S . -B build -DPICO_SDK_PATH=$PICO_SDK_PATH
        cmake --build build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pico-exclusive-firmware
        path: build/pico_exclusive_aim.uf2
