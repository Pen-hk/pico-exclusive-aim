name: Build Pico Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/raspberrypi/pico-sdk:1.5.1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build
      run: |
        cmake -S . -B build
        cmake --build build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pico-exclusive-firmware
        path: build/pico_exclusive_aim.uf2
